<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}"
    >

    {% seo %}
    {% include head-custom.html %}
  </head>

  <body>
    <div class="wrapper">
      <header>
        <h1>
          <a href="{{ '/' | relative_url }}">
            {{ site.title | default: site.github.repository_name }}
          </a>
        </h1>

        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}">
        {% endif %}

        <p>{{ site.description }}</p>

        <nav class="site-nav" aria-label="Main navigation">
          <a
            href="{{ '/' | relative_url }}"
            class="{% if page.url == '/' %}active{% endif %}"
          >
            Home
          </a>

          {% for item in site.navigation %}
            <a
              href="{{ item.url | relative_url }}"
              class="{% if page.url == item.url %}active{% endif %}"
            >
              {{ item.title }}
            </a>
          {% endfor %}
        </nav>

        <footer>
          <p>
            <small>
              Hosted on GitHub Pages<br>
              Theme by
              <a href="https://github.com/orderedlist/minimal">orderedlist</a>
            </small>
          </p>
        </footer>
      </header>

      <section>
        {{ content }}
      </section>
    </div>
  </body>
</html>
